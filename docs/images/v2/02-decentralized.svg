<rect x="88" y="493" width="360" height="177" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="106" y="513" width="4" height="30" rx="2" fill="#087D86" stroke="none" stroke-width="2"/>
