<text x="580" y="526" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#087D86" dominant-baseline="text-before-edge" text-anchor="middle">规则送审</text>
<text x="580" y="587" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#087D86" dominant-baseline="text-before-edge" text-anchor="middle">意图审查／异议</text>
<polyline points="268,670 268,727 444,727 444,812" fill="none" stroke="#285DAD" stroke-width="3"/>
<polygon points="444,812 450.0,799.0 438.0,799.0" fill="#285DAD"/>
