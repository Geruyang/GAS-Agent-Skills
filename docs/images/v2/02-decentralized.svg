<text x="268.0" y="563" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">制定规则与验收标准</text>
<text x="268.0" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">受理复议 · 修订规则</text>
<rect x="712" y="493" width="360" height="177" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="730" y="513" width="4" height="30" rx="2" fill="#087D86" stroke="none" stroke-width="2"/>
<text x="892.0" y="515" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">裁衡者</text>
<text x="892.0" y="563" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">审查规则与人类意图</text>
<text x="892.0" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">分析成果与监控证据</text>
<text x="892.0" y="631" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">不编写测试／验证代码</text>
<polyline points="460,564 700,564" fill="none" stroke="#087D86" stroke-width="3"/>
<polygon points="700,564 687.0,558.0 687.0,570.0" fill="#087D86"/>
