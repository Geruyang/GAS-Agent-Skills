<text x="1180" y="217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">02  Use in Codex</text>
<rect x="320" y="280" width="520" height="106" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="338" y="300" width="4" height="30" rx="2" fill="#285DAD" stroke="none" stroke-width="2"/>
<text x="580.0" y="302" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">Human / authorizer</text>
<text x="580.0" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Goals · Authorization · Budget · Acceptance</text>
<polyline points="580,386 580,459" fill="none" stroke="#285DAD" stroke-width="3"/>
<polygon points="580,459 586.0,446.0 574.0,446.0" fill="#285DAD"/>
<text x="608" y="408" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="start">Authorization / oversight</text>
<rect x="340" y="459" width="480" height="133" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="358" y="479" width="4" height="30" rx="2" fill="#285DAD" stroke="none" stroke-width="2"/>
<text x="580.0" y="481" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">Commander</text>
<text x="580.0" y="529" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Plan · Parallel dispatch · Decide</text>
<text x="580.0" y="563" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Integrate · Release · Roll back</text>
<polyline points="580,592 580,620 232,620 232,675" fill="none" stroke="#285DAD" stroke-width="3"/>
<polygon points="232,675 238.0,662.0 226.0,662.0" fill="#285DAD"/>
<polyline points="580,592 580,620 580,620 580,675" fill="none" stroke="#285DAD" stroke-width="3"/>
<polygon points="580,675 586.0,662.0 574.0,662.0" fill="#285DAD"/>
<polyline points="580,592 580,620 928,620 928,675" fill="none" stroke="#285DAD" stroke-width="3"/>
<polygon points="928,675 934.0,662.0 922.0,662.0" fill="#285DAD"/>
<rect x="477" y="628" width="206" height="32" rx="18" fill="white" stroke="none" stroke-width="2"/>
<text x="580" y="631" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="middle">Assign / coordinate</text>
<rect x="76" y="675" width="312" height="185" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="94" y="695" width="4" height="30" rx="2" fill="#285DAD" stroke="none" stroke-width="2"/>
<text x="232.0" y="697" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">Executors 1…N</text>
<text x="232.0" y="745" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Own independent tasks</text>
<text x="232.0" y="779" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Write tests / verification</text>
<text x="232.0" y="813" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Run checks; submit evidence</text>
<rect x="424" y="675" width="312" height="185" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="442" y="695" width="4" height="30" rx="2" fill="#285DAD" stroke="none" stroke-width="2"/>
<text x="580.0" y="697" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">Reviewer</text>
<text x="580.0" y="745" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Read work / monitor output</text>
<text x="580.0" y="779" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Analyze issues / evidence gaps</text>
<text x="580.0" y="813" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">No test / verification coding</text>
<rect x="772" y="675" width="312" height="185" rx="18" fill="#EDF3FC" stroke="#C7D5E7" stroke-width="2"/>
<rect x="790" y="695" width="4" height="30" rx="2" fill="#285DAD" stroke="none" stroke-width="2"/>
<text x="928.0" y="697" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="middle">Supervisor</text>
<text x="928.0" y="745" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Check intent and behavior</text>
<text x="928.0" y="779" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Monitor systems / agent status</text>
<text x="928.0" y="813" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="middle">Report anomalies / safety</text>
<polyline points="232,860 232,908 580,908 580,860" fill="none" stroke="#087D86" stroke-width="3"/>
<polygon points="580,860 574.0,873.0 586.0,873.0" fill="#087D86"/>
<polyline points="928,860 928,908 580,908 580,860" fill="none" stroke="#087D86" stroke-width="3"/>
<polygon points="580,860 574.0,873.0 586.0,873.0" fill="#087D86"/>
<text x="580" y="926" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#087D86" dominant-baseline="text-before-edge" text-anchor="middle">Implementation / verification + Monitoring / anomalies → Review</text>
<rect x="76" y="965" width="1008" height="154" rx="14" fill="#F2F6FC" stroke="none" stroke-width="2"/>
<text x="100" y="985" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">All subordinate roles report to the commander</text>
<text x="100" y="1032" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">Implementation and verification evidence; review findings; monitoring and safety</text>
<text x="100" y="1067" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">alerts. Supervision checks execution and review against commander intent.</text>
<rect x="76" y="1163" width="1008" height="99" rx="14" fill="#F0F3F7" stroke="none" stroke-width="2"/>
<text x="100" y="1181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">Main session: progress display and human interaction</text>
<text x="100" y="1225" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">All governance roles are real subagents; the main session holds no role.</text>
<rect x="1180" y="281" width="40" height="40" rx="10" fill="#EDF3FC" stroke="none" stroke-width="2"/>
<text x="1200" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="middle">1</text>
<text x="1238" y="284" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">Read the Skill and protocol</text>
<text x="1238" y="337" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">In the target project, read SKILL.md and</text>
<text x="1238" y="373" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">its protocol. Combined mode requires</text>
<text x="1238" y="409" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">all three sibling skill folders.</text>
<rect x="1180" y="471" width="548" height="84" rx="12" fill="#F2F6FC" stroke="none" stroke-width="2"/>
<text x="1202" y="486" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">After installation and discovery:</text>
<text x="1202" y="524" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="start">$gas-centralized-development</text>
<rect x="1180" y="595" width="40" height="40" rx="10" fill="#EDF3FC" stroke="none" stroke-width="2"/>
<text x="1200" y="600" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="middle">2</text>
<text x="1238" y="598" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">Confirm roles and the team</text>
<text x="1238" y="651" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">Choose N executors: N+3 real</text>
<text x="1238" y="687" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">subagents plus one main session. With</text>
<text x="1238" y="723" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">N=1, use 4 subagents.</text>
<text x="1238" y="807" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">Confirm models, reasoning effort and</text>
<text x="1238" y="841" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">roles. Wait for the whole team.</text>
<rect x="1180" y="902" width="40" height="40" rx="10" fill="#EDF3FC" stroke="none" stroke-width="2"/>
<text x="1200" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#285DAD" dominant-baseline="text-before-edge" text-anchor="middle">3</text>
<text x="1238" y="905" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#17283F" dominant-baseline="text-before-edge" text-anchor="start">Run ready work in parallel</text>
<text x="1238" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">The commander dispatches ready</text>
<text x="1238" y="994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">independent tasks. Implementation,</text>
<text x="1238" y="1030" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">review of ready outputs and monitoring</text>
<text x="1238" y="1066" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">overlap; dependencies and shared</text>
<text x="1238" y="1102" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">devices constrain concurrency.</text>
<rect x="1180" y="1163" width="548" height="99" rx="14" fill="#FFF8E9" stroke="none" stroke-width="2"/>
<text x="1200" y="1178" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#926017" dominant-baseline="text-before-edge" text-anchor="start">Monitor voltage/current, runtime, agents and</text>
<text x="1200" y="1207" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#926017" dominant-baseline="text-before-edge" text-anchor="start">system faults. Missing or stale readings never</text>
<text x="1200" y="1236" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#926017" dominant-baseline="text-before-edge" text-anchor="start">establish safety.</text>
<text x="60" y="1330" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#50627A" dominant-baseline="text-before-edge" text-anchor="start">Solid lines: authority / assignments / rules    Teal: evidence / analysis    N: user-selected executor count; default 1</text>
</svg>
